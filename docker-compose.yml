version: "3.9"

# ============================================================
# docker-compose.yml - FRONTEND
# Levanta el servicio frontend en conjunto con el backend
# para desarrollo local. En producción (EC2) se despliegan
# en instancias separadas.
# ============================================================

services:

  # ----------------------------------------------------------
  # Servicio: Frontend Flask
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime        # Usa el stage final (producción)
    container_name: innovatech-frontend
    restart: unless-stopped
    ports:
      - "5000:5000"          # Host:Contenedor
    environment:
      - PORT=5000
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-cambiar_en_produccion}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3000}
    env_file:
      - .env                 # Carga variables desde archivo .env local
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy   # Espera que el backend esté saludable
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------
  # Servicio: Backend Node.js (referencia para dev local)
  # En producción, este servicio corre en su propia EC2
  # ----------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-innovatech-backend:latest}
    container_name: innovatech-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-proyecto_db}
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:3000/api/usuarios',(r)=>r.statusCode<500?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------
  # Servicio: Base de datos MySQL
  # Named volume: los datos persisten entre reinicios
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: innovatech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-proyecto_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"          # Solo exponer en red interna en producción
    volumes:
      # Named volume: elegido sobre bind mount porque:
      # - Docker gestiona su ciclo de vida
      # - Portabilidad entre entornos
      # - Mayor rendimiento en Linux
      # - No depende de la estructura de directorios del host
      - mysql-data:/var/lib/mysql
      # Script de inicialización (se ejecuta solo si la BD está vacía)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ============================================================
# Redes: red interna para comunicación entre servicios
# ============================================================
networks:
  app-network:
    driver: bridge
    name: innovatech-network

# ============================================================
# Volúmenes: persistencia de datos de la base de datos
# Named volume elegido sobre bind mount:
#   + Gestionado por Docker (portabilidad)
#   + Mayor rendimiento I/O en Linux
#   + No expone rutas del host
# ============================================================
volumes:
  mysql-data:
    driver: local
    name: innovatech-mysql-data
