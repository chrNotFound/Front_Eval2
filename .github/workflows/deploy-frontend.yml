# ============================================================
# .github/workflows/deploy-frontend.yml
#
# Pipeline CI/CD - Frontend Flask
# Trigger: push a la rama "deploy"
#
# Flujo: build imagen → push a Docker Hub → deploy en EC2
# ============================================================

name: CI/CD Frontend - Innovatech

on:
  push:
    branches:
      - deploy          # Se activa SOLO con push a la rama deploy

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend
  CONTAINER_NAME: innovatech-frontend

jobs:

  # ----------------------------------------------------------
  # JOB 1: Build y Push de la imagen Docker
  # ----------------------------------------------------------
  build-and-push:
    name: Build & Push imagen Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código fuente
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # 2. Configurar Docker Buildx (soporte multi-plataforma)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login en Docker Hub usando secrets del repositorio
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Extraer metadatos para tagging de la imagen
      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # 5. Build y Push de la imagen (multi-stage Dockerfile)
      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: runtime          # Stage final del multi-stage build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha    # Cache de capas en GitHub Actions
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # JOB 2: Deploy en instancia EC2 Frontend
  # Depende del job anterior (build-and-push exitoso)
  # ----------------------------------------------------------
  deploy-to-ec2:
    name: Deploy en EC2 Frontend
    runs-on: ubuntu-latest
    needs: build-and-push      # Solo ejecuta si build fue exitoso

    steps:
      # 1. Checkout (necesario para tener acceso al docker-compose)
      - name: Checkout código fuente
        uses: actions/checkout@v4

      # 2. Conectar a EC2 via SSH y ejecutar deploy
      - name: Deploy en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}       # IP pública de EC2 Frontend
          username: ${{ secrets.EC2_USERNAME }}         # ec2-user o ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}       # Clave PEM del par de claves EC2
          port: 22
          script: |
            # ---- Variables de entorno en EC2 ----
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            export CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"

            # ---- Login en Docker Hub desde EC2 ----
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # ---- Descargar la imagen más reciente ----
            docker pull ${IMAGE_NAME}:latest

            # ---- Detener y eliminar contenedor anterior (si existe) ----
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME   2>/dev/null || true

            # ---- Iniciar nuevo contenedor ----
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 5000:5000 \
              -e PORT=5000 \
              -e DEBUG=False \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e BACKEND_URL="${{ secrets.BACKEND_URL }}" \
              ${IMAGE_NAME}:latest

            # ---- Verificar que el contenedor está corriendo ----
            sleep 10
            docker ps --filter "name=$CONTAINER_NAME" --format "{{.Status}}"

            # ---- Limpiar imágenes antiguas (liberar espacio) ----
            docker image prune -f

            echo "✅ Deploy frontend completado exitosamente"
